name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No lockfile is committed yet; switch to --frozen-lockfile once it is.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: ${{ matrix.service }} (ruff, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, ai-api]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  migrations:
    name: core-api migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ledgerlens
          POSTGRES_USER: ledgerlens
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlens -d ledgerlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ci-only-password
      LEDGERLENS_DEMO_PASSWORD: ci-demo-password-only
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Apply every migration
        run: python manage.py migrate --noinput
      - name: Migrations roll back and re-apply
        run: |
          python manage.py migrate accounts zero --noinput
          python manage.py migrate --noinput
      - name: Demo seed is idempotent
        run: |
          python manage.py seed_demo_orgs
          python manage.py seed_demo_orgs
          python manage.py shell -c "
          from modules.accounts.models import Membership, Organization
          assert Organization.objects.count() == 2, Organization.objects.count()
          assert Membership.objects.count() == 5, Membership.objects.count()
          "

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml with the example environment
        run: docker compose --env-file .env.example config --quiet
