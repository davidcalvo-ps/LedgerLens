name: ledgerlens

# Local development stack. Copy .env.example to .env first.
# Published ports bind to 127.0.0.1 only.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlens}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: ./services/core-api
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,core-api
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      LEDGERLENS_DEMO_PASSWORD: ${LEDGERLENS_DEMO_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlens}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AI_API_URL: http://ai-api:8100
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    networks: [data, services]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Internal service: only core-api can reach it, and it has no route to the
  # database or Redis (see ADR 0001).
  ai-api:
    build: ./services/ai-api
    environment:
      LEDGERLENS_ENV: local
    expose:
      - "8100"
    networks: [services]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/v1/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  data:
  services:

volumes:
  postgres-data:
  redis-data:
